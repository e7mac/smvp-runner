name: Scheduled Publish (Postiz) (runner)

# Public runner — see daily-pipeline.yml. Pushes APPROVED items onto a rolling
# future calendar in Postiz. The DB-backed "Publishing" toggle on the Settings
# page (drafts.e7mac.com) decides whether this actually posts; OFF = dry-run.

on:
  schedule:
    - cron: '0 14 * * *'   # 14:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: e7mac/social-media-video-pipeline
          ref: main
          token: ${{ secrets.SMVP_REPO_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      # Approving was the last manual step — one click per video — which is why
      # accounts went dark while sitting on hundreds of drafts. Picks by MEASURED
      # per-video performance (post_metrics), per ACCOUNT, one slot per format.
      #
      # This mirrors the step in the private repo's publish.yml. That copy is
      # workflow_dispatch-only — the CRON lives here — so without this the
      # auto-approver never ran on a schedule and cadence still depended on
      # hand-clicking Publish-now. Any new step added there must be added here.
      #
      # Runs BEFORE the scheduler so anything approved here goes out on the same
      # run. Still governed by the Settings toggle downstream: with publishing
      # OFF this only moves rows draft -> approved.
      - name: Auto-approve the best-performing drafts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # RET (the lab account) runs at --per-app 3: its two chord_quiz pool
        # lanes (classical + modern) are deliberately separately capped, so a
        # global --per-app 2 hands both RET slots to chord_quiz and a second
        # format (lesson_modules) can never earn its first data point. The
        # other accounts stay at 2.
        run: |
          python scripts/auto_approve.py --app realeartrainer --per-app 3 --per-recipe 1 --apply
          python scripts/auto_approve.py --app stave --app whozart --per-app 2 --per-recipe 1 --apply
      - name: Schedule approved items into Postiz
        env:
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
          # Re-presigning at publish time (publish.py _media_url): stored
          # s3_url values die after 7 days; long-lived queues (stave
          # notation_short) outlive them.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CORPUS_DATABASE_URL: ${{ secrets.CORPUS_DATABASE_URL }}
        run: python scripts/publish.py --schedule
