name: Collect Analytics (runner)

# Public runner — see daily-pipeline.yml.

on:
  schedule:
    - cron: "30 14 * * *"   # daily, after the morning posting window
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: e7mac/social-media-video-pipeline
          ref: main
          token: ${{ secrets.SMVP_REPO_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests "psycopg[binary]"
      - name: Collect channel analytics from Postiz
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: python scripts/collect_analytics.py --days 30
      # Per-POST rows: which recipe actually worked, which the channel series
      # structurally cannot answer (the accounts also carry hand-posted videos,
      # so a channel total is not attributable to a format). Re-run daily so
      # view counts track over time. Kept as a separate step and not `if:
      # failure()`-coupled — a Postiz hiccup on one pass shouldn't hide the other.
      #
      # MUST stay in sync with social-media-video-pipeline/.github/workflows/
      # analytics.yml. That repo's workflows are workflow_dispatch-only; the cron
      # lives here, so a step added only there never runs on a schedule. This
      # step was missing here from 08-18 to 08-19 and post_metrics — the table
      # auto_approve.py ranks formats by — silently never refreshed.
      - name: Collect per-post metrics
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: python scripts/collect_analytics.py --posts --days 30
